<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Decolagem</title>
    <style>
      :root {
        color-scheme: light;
        --background: #f5f7fb;
        --surface: #ffffff;
        --surface-soft: #f8f9ff;
        --primary: #5b6cff;
        --primary-dark: #3b4ce3;
        --text: #1a2238;
        --muted: #69758c;
        --border: #e4e7f0;
        --danger: #d93d5d;
        --shadow: 0 20px 45px rgba(74, 92, 165, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        background: linear-gradient(180deg, #f7f8fc 0%, #eef2ff 100%);
        color: var(--text);
      }

      .page {
        width: min(100%, 720px);
        margin: 0 auto;
        padding: 56px 24px 80px;
      }

      .app-card {
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.7);
        border-radius: 28px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(10px);
        overflow: hidden;
      }

      .header {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 36px 32px 28px;
        background: linear-gradient(135deg, #ffffff 0%, #f7f8ff 100%);
        border-bottom: 1px solid var(--border);
      }

      .app-icon {
        display: grid;
        place-items: center;
        width: 48px;
        height: 48px;
        border-radius: 14px;
        background: linear-gradient(135deg, var(--primary), #8b7cff);
        color: #ffffff;
        box-shadow: 0 10px 24px rgba(91, 108, 255, 0.24);
      }

      .app-icon svg {
        width: 25px;
        height: 25px;
      }

      .title {
        margin: 0;
        font-size: clamp(1.75rem, 4vw, 2.4rem);
        font-weight: 800;
        letter-spacing: -0.05em;
      }

      .subtitle {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 0.96rem;
      }

      .content {
        padding: 28px 32px 32px;
      }

      .form-card {
        padding: 20px;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: var(--surface-soft);
      }

      form {
        display: grid;
        grid-template-columns: minmax(0, 1.5fr) minmax(140px, 0.7fr) auto;
        gap: 12px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .field label {
        color: var(--muted);
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.03em;
        text-transform: uppercase;
      }

      .field input {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 15px 16px;
        background: var(--surface-soft);
        color: var(--text);
        font: inherit;
        outline: none;
        transition:
          border-color 0.2s ease,
          box-shadow 0.2s ease,
          background 0.2s ease;
      }

      .field input:focus {
        border-color: rgba(91, 108, 255, 0.55);
        background: #ffffff;
        box-shadow: 0 0 0 4px rgba(91, 108, 255, 0.12);
      }

      .button {
        align-self: end;
        min-width: 120px;
        border: 0;
        border-radius: 14px;
        padding: 15px 20px;
        background: linear-gradient(135deg, var(--primary), #7a6cff);
        color: #ffffff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        transition:
          transform 0.2s ease,
          background 0.2s ease,
          box-shadow 0.2s ease;
        box-shadow: 0 10px 24px rgba(91, 108, 255, 0.24);
      }

      .button:hover:not(:disabled) {
        background: linear-gradient(135deg, var(--primary-dark), #5c52e6);
        transform: translateY(-1px);
      }

      .button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      .message {
        min-height: 24px;
        margin: 16px 0 0;
        color: var(--danger);
        font-size: 0.9rem;
        font-weight: 600;
      }

      .message.success {
        color: #1f7a5d;
      }

      .expenses {
        margin-top: 30px;
        border: 1px solid var(--border);
        border-radius: 20px;
        overflow: hidden;
        background: #ffffff;
      }

      .expenses-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 20px;
        border-bottom: 1px solid var(--border);
        background: #fafbff;
      }

      .expenses-header h2 {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0;
        font-size: 1rem;
      }

      .expenses-header h2 svg {
        width: 16px;
        height: 16px;
        color: var(--primary);
      }

      .expenses-count {
        color: var(--muted);
        font-size: 0.82rem;
      }

      .expenses-list {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .expense-item {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        padding: 18px 20px;
        border-bottom: 1px solid var(--border);
      }

      .expense-item:last-child {
        border-bottom: 0;
      }

      .expense-description {
        overflow-wrap: anywhere;
        word-break: break-word;
      }

      .expense-amount {
        font-weight: 700;
        white-space: nowrap;
      }

      .empty-state {
        padding: 38px 20px;
        text-align: center;
        color: var(--muted);
      }

      .total {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        padding: 18px 20px;
        background: #f4f6ff;
        border-top: 1px solid var(--border);
        font-weight: 800;
      }

      .total-label {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        font-size: 0.75rem;
      }

      .total-label svg {
        width: 14px;
        height: 14px;
      }

      .total-value {
        color: var(--primary);
        font-size: 1.5rem;
        letter-spacing: -0.03em;
      }

      @media (max-width: 640px) {
        .page {
          padding-top: 24px;
        }

        .header,
        .content {
          padding-left: 20px;
          padding-right: 20px;
        }

        form {
          grid-template-columns: 1fr;
        }

        .button {
          width: 100%;
        }

        .expense-item {
          align-items: center;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="app-card" aria-labelledby="app-title">
        <header class="header">
          <span class="app-icon" aria-hidden="true">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M2 16.5V7.5L12 2l10 5.5v9L12 22l-10-5.5Z" />
              <path d="M12 2v20M2 7.5l10 5.5 10-5.5" />
            </svg>
          </span>
          <div>
            <h1 id="app-title" class="title">Decolagem</h1>
            <p class="subtitle">Acompanhe seus gastos de forma simples.</p>
          </div>
        </header>

        <div class="content">
          <div class="form-card">
            <form id="expense-form" novalidate>
              <div class="field">
                <label for="description">Descrição</label>
                <input
                  id="description"
                  name="description"
                  type="text"
                  placeholder="Ex.: Supermercado"
                  autocomplete="off"
                  required
                />
              </div>

              <div class="field">
                <label for="amount">Valor</label>
                <input
                  id="amount"
                  name="amount"
                  type="number"
                  step="0.01"
                  min="0.01"
                  placeholder="0,00"
                  required
                />
              </div>

              <button class="button" type="submit">Adicionar</button>
            </form>
          </div>

          <p
            id="form-message"
            class="message"
            role="alert"
            aria-live="polite"
          ></p>

          <section class="expenses" aria-labelledby="expenses-title">
            <div class="expenses-header">
              <h2 id="expenses-title">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path
                    d="M4 7.5A2.5 2.5 0 0 1 6.5 5h11A2.5 2.5 0 0 1 20 7.5v9A2.5 2.5 0 0 1 17.5 19h-11A2.5 2.5 0 0 1 4 16.5v-9Z"
                  />
                  <path d="M8 3v4M16 3v4M4 9.5h16" />
                </svg>
                Gastos
              </h2>
              <span id="expenses-count" class="expenses-count">0 itens</span>
            </div>

            <ul
              id="expenses-list"
              class="expenses-list"
              aria-live="polite"
            ></ul>

            <footer class="total" aria-label="Total de gastos">
              <span class="total-label">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path
                    d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7H14.5a3.5 3.5 0 0 1 0 7H6"
                  />
                </svg>
                Total
              </span>
              <span id="total-value" class="total-value">R$ 0,00</span>
            </footer>
          </section>
        </div>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
